name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install published Kujo runtime
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@9fbad956eecd37448d6dc2f3568105cd1da7b0b0
        with:
          version: v1.6.0

      - name: Export runtime
        shell: bash
        run: echo "KUJO_BIN=${{ steps.runtime.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          "$KUJO_BIN" --version
          "$KUJO_BIN" run --help >/dev/null

      - name: Run CLI contract
        shell: bash
        run: |
          set -euo pipefail
          KUJO_BIN="$KUJO_BIN" tests/cli-output-contract.sh

      - name: Validate source and hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          for source in shipcheck.kujo src/*.kujo; do
            "$KUJO_BIN" check "$source"
            "$KUJO_BIN" lint "$source"
          done
          KUJO_BIN="$KUJO_BIN" python3 tests/hardening-contract.py

      - name: Run ShipCheck self scan and gate
        shell: bash
        run: |
          set -euo pipefail
          "$KUJO_BIN" run shipcheck.kujo scan --dir . --format json
          "$KUJO_BIN" run shipcheck.kujo gate --dir .

  portable-git:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        kujo: [v1.6.0, v1.8.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install published native runtime
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@9fbad956eecd37448d6dc2f3568105cd1da7b0b0
        with:
          version: ${{ matrix.kujo }}
      - name: Real Git contracts without shell authority in both execution modes
        run: node tests/git-portability.mjs
        env:
          KUJO_BIN: ${{ steps.runtime.outputs.kujo-path }}
