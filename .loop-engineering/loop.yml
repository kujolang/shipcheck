objective: "Evaluate HLP-004 migration to the first-party CLI parser package while preserving ShipCheck command, report, and exit-code contracts."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "for f in shipcheck.kujo src/*.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check $f >/dev/null || exit 1; done"
  - id: cli_contract
    command: "if [ -x tests/cli-output-contract.sh ]; then KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/cli-output-contract.sh; else echo 'shipcheck has no shell contract runner'; fi"
  - id: diff_check
    command: "files=$(git diff --name-only | grep -v '^.loop-engineering/' || true); [ -z \"$files\" ] || git diff --check -- $files"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
