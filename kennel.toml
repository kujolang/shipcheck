[package]
name = "shipcheck"
version = "1.0.0"
description = "Release-readiness scanner for Kujo ecosystem projects. Inspects a repository and produces structured reports, checklists, and release gate validation."
license = "MIT"
authors = ["Kujolang <me@kujolang.ai>"]
repository = "https://github.com/kujolang/shipcheck"
keywords = ["kujo", "release", "readiness", "checklist", "devtools"]
categories = ["developer-tools"]
readme = "README.md"

[package.status]
stage = "production"
stability = "stable"
public_api = true
notes = "Stable deterministic scan, checklist, gate, release-note, Markdown, and JSON contracts for local and CI usage."

[kujo]
minimum_version = "0.1.0"
entry = "shipcheck.kujo"
sources = ["."]
includes = ["README.md"]
excludes = [".git", ".dogfood", "dist", "build", "node_modules"]

[scripts]
test = "kujo run shipcheck.kujo scan"
smoke = "kujo run shipcheck.kujo scan --format json"

[dependencies]

[trust]
checksum = ""
signature = ""
signing_key = ""
